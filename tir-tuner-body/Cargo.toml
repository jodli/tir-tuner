[package]
name = "tir-tuner-body"
version = "0.1.0"
edition = "2021"
description = "Physiological virtual-patient model for in-silico closed-loop testing"
license = "MIT OR Apache-2.0"

[lib]
name = "tir_tuner_body"

[dependencies]
document_formulas = "0.2.0"
tir-tuner-common = { path = "../tir-tuner-common" }

[dev-dependencies]
proptest = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }