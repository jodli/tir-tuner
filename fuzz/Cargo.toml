[package]
name = "tir-tuner-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

[dependencies.tir-tuner-common]
path = "../tir-tuner-common"

[dependencies.tir-tuner-aps]
path = "../tir-tuner-aps"

[[bin]]
name = "hovorka_step"
path = "fuzz_targets/hovorka_step.rs"
test = false
doc = false
bench = false

[[bin]]
name = "nmpc_sequence"
path = "fuzz_targets/nmpc_sequence.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
