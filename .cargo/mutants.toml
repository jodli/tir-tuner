test_package = ["tir-tuner-body", "tir-tuner-cgm", "tir-tuner-bolus", "tir-tuner-common", "tir-tuner-aps", "tir-tuner-store", "tir-tuner-sim", "tir-tuner-analysis", "tir-tuner-cli"]
# Mutants that can't change a result. Exact
# positions: update them when these lines move.
exclude_re = [
  # g == target lands on target in either branch.
  "controller.rs:116:21: replace > with >= in trajectory$",
  # Divides by ROLLOUT_STEP_MIN = 1.
  "controller.rs:175:39: replace / with \\* in Nmpc::cost$",
  # An equal-cost move changes nothing but the pass count.
  "controller.rs:233:26: replace < with <= in Nmpc::sequence$",
  # Weights sum to 1, so sum w (m_i + x_i)(m_j - x_j) is still the covariance.
  "kalman.rs:185:58: replace - with \\+ in mixture$",
  "kalman.rs:185:76: replace - with \\+ in mixture$",
  # f exactly 0 at a midpoint: either branch keeps the root bracketed.
  "euler.rs:24:19: replace > with >= in bisect_falling$",
]
