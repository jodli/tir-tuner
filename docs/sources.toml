# Bolus calculator

[[claim]]
id = "man-carb-ratio"
source = "camaps-manual"
at = "p64"
status = "derived"
note = "CR is grams covered by one unit, so the meal part is carbs / CR."

[[claim]]
id = "man-correction-factor"
source = "camaps-manual"
at = "p63"
status = "derived"
note = "CF is the drop per unit and the correction aims at the bolus target, so (glucose - target) / CF."

[[claim]]
id = "man-negative-correction"
source = "camaps-manual"
at = "p63"
status = "source"

[[claim]]
id = "man-iob-correction-only"
source = "camaps-manual"
at = "p64"
status = "source"
note = "Floored at 0: IOB is never subtracted from the meal part."

[[claim]]
id = "man-max-bolus-cap"
source = "camaps-manual"
at = "p63"
status = "source"
note = "The floor at 0 (no negative bolus) is ours."

[[claim]]
id = "man-min-glucose-refuse"
source = "camaps-manual"
at = "p62"
status = "source"
note = "'a lower current glucose value': strictly below."

[[claim]]
id = "man-auto-meal-no-glucose"
source = "camaps-manual"
at = "p51"
status = "source"

[[claim]]
id = "man-ypsopump-bolus-step"
source = "camaps-manual"
at = "p50"
values = [10.0]
status = "source"
note = "0.1 U steps on YpsoPump, as steps per unit."

[[claim]]
id = "user-rounding-nearest"
source = "user"
at = "2026-10-10"
status = "user"
note = "The user's guess; neither manual says. Check: 3 g at CR 12 without glucose is 0.25 U, the app shows 0.2 or 0.3."

[[claim]]
id = "user-iob-below-target"
source = "user"
at = "2026-10-10"
status = "user"
note = "Below target, more IOB gives a smaller suggestion. Contradicts manual p64 'never subtracted from the meal bolus'. At exactly target the correction stays 0; whether the app subtracts IOB there is open."

