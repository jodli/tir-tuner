# Controller (tir-tuner-aps). CamAPS FX itself isn't published: these are
# its published lineage and our stand-ins.

[[claim]]
id = "us504-egp"
source = "us504"
at = "p11, eq 12"
status = "source"
note = "EGP_B exp(-(r_E - BIC) ln2 / I_1/2). No values for EGP_B or I_1/2."

[[claim]]
id = "h04-period"
source = "h04"
at = "p7"
values = [15.0]
status = "source"
note = "CamAPS FX adjusts every 8-12 min (ware2022 p4); the manual allows 5-15 min cycles (p72)."

[[claim]]
id = "h04-horizon"
source = "h04"
at = "p9"
values = [240.0]
status = "source"
note = "Wilinska 2010 used 2.5 h. The FX horizon is unknown."

[[claim]]
id = "h04-max-rate"
source = "h04"
at = "p9, eq 9"
values = [4.0]
status = "source"
note = "4 U/h for 2004 pumps. CamAPS sets it per person (manual p70), rule unpublished."

[[claim]]
id = "h04-trajectory"
source = "h04"
at = "p8, Fig 4"
values = [2.0, 2.0, 1.0, 15.0]
status = "derived"
note = "H04 gives bands for target 6: 2 mmol/L/h above 8, 1 mmol/L/h for 6-8, 15 min halftime below 6. Here relative to the personal target."

[[claim]]
id = "own-kagr"
source = "own"
values = [5.0]
status = "assumption"
note = "H04 p9 gives the tuning rule (<5% of 36 runs below 3.3 mmol/L, fasting near 6), not the value."

[[claim]]
id = "own-rollout-step"
source = "own"
values = [1.0]
status = "assumption"
note = "The patent discretizes exactly (us504 eq 18-45). One minute matches the belief's own steps and keeps k31 dt < 1."

[[claim]]
id = "own-optimizer"
source = "own"
values = [6, 5, 50]
status = "assumption"
note = "Grid seed plus coordinate descent, at most 50 passes like H04 p9 capped Marquardt at 50 iterations. The patent uses a closed form (eq 99)."

[[claim]]
id = "own-hypo-cutoff"
source = "own"
status = "assumption"
note = "The lowest personal target, 4.4 (ware2022-target-range). No source has a suspend threshold. The manual (p70) only says insulin may be reduced further when glucose is low or falling fast."

[[claim]]
id = "own-reanchor"
source = "own"
values = [0.5]
status = "assumption"
note = "Stand-in for the patent's Kalman/IMM update (eq 72-77)."

[[claim]]
id = "ware2022-ease-off"
source = "ware2022"
at = "p4; 126 mg/dL in ware2022b p3"
values = [7.0]
status = "source"
note = "Suspends algorithm insulin below 7.0 and raises the target."

[[claim]]
id = "own-ease-off-target"
source = "own"
status = "assumption"
note = "The raised Ease-off target isn't published (ware2022 p4, manual p47 'slightly higher'). We use at least the 7.0 suspension level."

[[claim]]
id = "ware2022b-boost"
source = "ware2022b"
at = "p3"
values = [1.35]
status = "source"
note = "'approximately 35%', glucose-responsive, inactive once target is reached."

[[claim]]
id = "own-imm"
source = "own"
values = [3, 0.95, 0.05, 0.05, 0.03, 0.90, 0.05, 0.02, 0.05, 0.90]
status = "assumption"
note = "The patent (us504 p14, eq 65) defines N models and the transition matrix without values."

# Virtual patient (tir-tuner-body)

[[claim]]
id = "w10-population"
source = "wilinska2010"
at = "p6"
values = [74.9]
status = "source"
note = "Mean body weight of the 18 virtual subjects (74.9 +- 14.4 kg). The sets aren't published."

[[claim]]
id = "w10-table1"
source = "wilinska2010"
at = "p6, Table 1"
values = [11.1e-3, 16.9e-3, 0.060, 18.41e-4, 5.05e-4, 0.019, 0.0034, 0.056, 0.024]
status = "source"
note = "F01, EGP0, k12, SIT, SID, SIE, kb1-kb3. Means of marginal lognormals; W10 gives no SDs, so the subject has no spread here."

[[claim]]
id = "w10-table2"
source = "wilinska2010"
at = "p7, Table 2"
values = [0.15, 0.12, 0.14, 9.0, 0.01, 40.0, 0.0933]
status = "source"
note = "VG, VI, ke, R_thr, R_cl, tmax, ka_int: means, or medians of the lognormal priors (ka_int = exp(-2.372))."

[[claim]]
id = "w10-bio"
source = "wilinska2010"
at = "p7, Table 2"
values = [0.95]
status = "derived"
note = "Mean of Bio ~ U(70%, 120%)."

[[claim]]
id = "w10-ug-ceil"
source = "wilinska2010"
at = "p13"
values = [0.0275]
status = "derived"
note = "Mean of UG_ceil ~ U(0.02, 0.035) mmol/kg/min."

[[claim]]
id = "w10-oscillation"
source = "wilinska2010"
at = "p6; Tables 1-2"
values = [0.05, 180.0, 12]
status = "source"
note = "5% amplitude, 3 h period, phases U[0, 3 h]; 12 parameters marked oscillatory (F01, EGP0, k12, SID, SIE, SIT, kb1-3, ka, ke, ka_int)."

[[claim]]
id = "w10-bio-interoccasion"
source = "wilinska2010"
at = "p7, Table 2 footnote"
values = [0.2]
status = "derived"
note = "'An additional 20% interoccasion variability'. The distribution isn't given; we draw normal with CV 20%, floored at 0."

[[claim]]
id = "h04-egp"
source = "h04"
at = "p3, eq 1"
status = "source"
note = "EGP0 [1 - x3], as H02 eq 7 (p5); floored at 0 as W10 p12. W10 prints 1 + x3, a sign typo."

[[claim]]
id = "w10-f01c"
source = "wilinska2010"
at = "p12"
values = [0.85]
status = "source"
note = "F01c = F01/0.85 G/(G+1). H04 eq 2 has a piecewise form instead."

[[claim]]
id = "heise-fiasp-ka"
source = "heise2017csii"
at = "p5, Table 1"
values = [0.0207]
status = "derived"
note = "Least-squares fit of W10's two-depot chain (ke 0.14) to Fiasp by CSII: tEarly50 20.7, tmax 56.6, tLate50 137.4 min. The fit gives 18.4 / 56.6 / 137.6; the two-depot shape rises too early. W10's lispro ka is 0.018."

[[claim]]
id = "walsh-basal-share"
source = "walsh2011"
at = "p3, eq 1"
values = [0.48]
status = "source"
note = "Basal = TDD x 0.48."

[[claim]]
id = "walsh-carb-factor"
source = "walsh2011"
at = "p3, eq 2"
values = [5.7, 10.0]
status = "derived"
note = "CarbF (g/U) = 5.7 x weight(kg) / TDD, from the subject's resting basal at the default target via eq 1; ratios are per 10 g. W10's population 1.7 U/10 g is a mean over subjects and takes the mean subject to 2.8 mmol/L after 60 g."

[[claim]]
id = "own-body-step"
source = "own"
values = [0.25]
status = "assumption"
note = "W10 doesn't give its solver. Clamped Euler; the fastest rate (ke 0.14/min) times 0.25 min is 0.035."

[[claim]]
id = "math-bisection"
source = "math"
values = [60]
status = "source"
note = "Bisection midpoint; 60 halvings of [0, 1/SIE] reach f64 resolution."

[[claim]]
id = "w10-pump-error"
source = "wilinska2010"
at = "p3, p7"
values = [0.05]
status = "source"
note = "Zero mean, uncorrelated, CV 5% for infusion and bolus. W10's min/max bracket has no values. YpsoPump IFU p185 states +-5% for basal and 6 U boluses."

[[claim]]
id = "ypsopump-bolus-speed"
source = "ypsopump-ifu"
at = "p185"
values = [6.6]
status = "derived"
note = "'Abgabegeschwindigkeit waehrend Abgabe: 0,11 U/Sekunde', x 60 s."

# CGM sensor

[[claim]]
id = "b08-eq7"
source = "breton2008"
at = "p8, eq 7; p7, Fig 5B"
values = [0.7]
status = "source"
note = "e_1 = v_1, e_n = 0.7 (e_(n-1) + v_n), v_n ~ N(0, 1). Fitted on the FreeStyle Navigator; no source here models Libre 3 error."

[[claim]]
id = "b08-interval"
source = "breton2008"
at = "p6"
values = [15.0]
status = "source"
note = "'the reference glucose measures were equally spaced at 15 minutes': eq 7's 0.7 is per 15 min. Matches H04's 15-min control period. Libre 3 reads every minute (CamAPS manual p93); CamAPS decides every 8-12 min (Boughton 2026 p6)."

[[claim]]
id = "b08-johnson"
source = "breton2008"
at = "p7, Table 1; p8, eq 7"
values = [15.96, -5.471, 1.6898, -0.5444]
status = "source"
note = "lambda, xi, delta, gamma of the unbounded Johnson system: error = xi + lambda sinh((e_n - gamma)/delta) mg/dL. B08 p6 reports mean 0.76, SD 11 mg/dL; eq 7 with these gives 0.7 and 11.7."

[[claim]]
id = "user-cgm-integers"
source = "user"
status = "derived"
note = "All 61229 readings in the user's two Libre 3 exports are whole mg/dL, 49-383. Floor at 0 is ours: no source gives the Libre 3 range or LO/HI."
