# Every number and rule on the medical path, traced to a source.
#
# Code tags a claim with `src: <id>` in a comment. The test
# tir-tuner-common/tests/sources.rs fails when a literal in a `lint.files`
# file isn't in a tagged const, when a tag names no claim, when a claim's
# `values` aren't the literals in its consts, or when a claim isn't used.
#
# status: source  = the source says it
#         derived = follows from the source, `note` says how
#         user    = the user told us
#         open    = unknown; the code refuses or leaves it out
#         assumption = no source; our choice for the simulation, `note` says why
#
# Pages are PDF pages. The PDFs stay local in docs/papers/ (gitignored).

[lint]
files = [
  "tir-tuner-bolus/src/lib.rs",
  "tir-tuner-common/src/data.rs",
  "tir-tuner-common/src/metrics.rs",
  "tir-tuner-common/src/settings.rs",
  "tir-tuner-common/src/units.rs",
  "tir-tuner-aps/src/settings.rs",
  "tir-tuner-aps/src/lib.rs",
  "tir-tuner-aps/src/hovorka.rs",
  "tir-tuner-aps/src/controller.rs",
  "tir-tuner-aps/src/imm.rs",
  "tir-tuner-body/src/derivative.rs",
  "tir-tuner-body/src/pump.rs",
  "tir-tuner-body/src/solver.rs",
  "tir-tuner-body/src/state.rs",
  "tir-tuner-body/src/subject.rs",
  "tir-tuner-cgm/src/device.rs",
]
# Literals allowed anywhere. Everything else is a named, tagged const.
allowed = [0, 1]

[sources]
camaps-manual = "mylife CamAPS FX user manual, mmol/L edition (camaps_fx_manual.pdf)"
ware2022 = "Ware J et al. Cambridge hybrid closed-loop algorithm in children and adolescents with type 1 diabetes. Lancet Digit Health 2022;4(4):e245-e255. doi:10.1016/S2589-7500(22)00020-6"
ware2022b = "Ware J et al. Safety of user-initiated intensification of insulin delivery using Cambridge hybrid closed-loop algorithm. J Diabetes Sci Technol 2024;18(4):882-888. doi:10.1177/19322968221141924"
battelino2019 = "Battelino T et al. Clinical targets for continuous glucose monitoring data interpretation: international consensus on time in range. Diabetes Care 2019;42(8):1593-1603. doi:10.2337/dci19-0028"
iupac = "IUPAC standard atomic weights: C 12.011, H 1.008, O 15.999"
definition = "Unit definitions (SI prefixes, clock)"
user = "The user, in conversation"
h04 = "Hovorka R et al. Nonlinear model predictive control of glucose concentration in subjects with type 1 diabetes. Physiol Meas 2004;25(4):905-920. doi:10.1088/0967-3334/25/4/010"
us504 = "US8977504B2, Hovorka R. Substance monitoring and control in human or animal bodies (US member of the CA2702345C family)"
h02 = "Hovorka R et al. Partitioning glucose distribution/transport, disposal, and endogenous production during IVGTT. Am J Physiol Endocrinol Metab 2002;282(5):E992-E1007. doi:10.1152/ajpendo.00304.2001"
heise2017csii = "Heise T et al. Pharmacological properties of faster-acting insulin aspart vs insulin aspart in patients with type 1 diabetes receiving continuous subcutaneous insulin infusion. Diabetes Obes Metab 2017;19(2):208-215. doi:10.1111/dom.12803"
walsh2011 = "Walsh J, Roberts R, Bailey T. Guidelines for optimal bolus calculator settings in adults. J Diabetes Sci Technol 2011;5(1):129-135. doi:10.1177/193229681100500118"
ypsopump-ifu = "mylife YpsoPump Gebrauchsanweisung, German edition (ypsopump_ifu_de.pdf)"
math = "Mathematics"
wilinska2010 = "Wilinska ME et al. Simulation environment to evaluate closed-loop insulin delivery systems in type 1 diabetes. J Diabetes Sci Technol 2010;4(1):132-144. doi:10.1177/193229681000400117"
breton2008 = "Breton M, Kovatchev B. Analysis, modeling, and simulation of the accuracy of continuous glucose sensors. J Diabetes Sci Technol 2008;2(5):853-862. doi:10.1177/193229680800200517"
own = "Our own choice, no source"

