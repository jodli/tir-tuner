# Every number and rule on the medical path, traced to a source.
#
# Code tags a claim with `src: <id>` in a comment. The test
# tir-tuner-common/tests/sources.rs fails when a literal in a `lint.files`
# file isn't in a tagged const, when a tag names no claim, when a claim's
# `values` aren't the literals in its consts, or when a claim isn't used.
#
# status: source  = the source says it
#         derived = follows from the source, `note` says how
#         user    = the user told us
#         open    = unknown; the code refuses or leaves it out
#         assumption = no source; our choice for the simulation, `note` says why
#
# Pages are PDF pages. The PDFs stay local in docs/papers/ (gitignored).

[lint]
files = [
  "tir-tuner-bolus/src/lib.rs",
  "tir-tuner-common/src/data.rs",
  "tir-tuner-common/src/metrics.rs",
  "tir-tuner-common/src/settings.rs",
  "tir-tuner-common/src/units.rs",
  "tir-tuner-aps/src/settings.rs",
  "tir-tuner-aps/src/lib.rs",
  "tir-tuner-aps/src/hovorka.rs",
  "tir-tuner-aps/src/controller.rs",
  "tir-tuner-aps/src/imm.rs",
]
# Literals allowed anywhere. Everything else is a named, tagged const.
allowed = [0, 1]

[sources]
camaps-manual = "mylife CamAPS FX user manual, mmol/L edition (camaps_fx_manual.pdf)"
ware2022 = "Ware J et al. Cambridge hybrid closed-loop algorithm in children and adolescents with type 1 diabetes. Lancet Digit Health 2022;4(4):e245-e255. doi:10.1016/S2589-7500(22)00020-6"
ware2022b = "Ware J et al. Safety of user-initiated intensification of insulin delivery using Cambridge hybrid closed-loop algorithm. J Diabetes Sci Technol 2024;18(4):882-888. doi:10.1177/19322968221141924"
battelino2019 = "Battelino T et al. Clinical targets for continuous glucose monitoring data interpretation: international consensus on time in range. Diabetes Care 2019;42(8):1593-1603. doi:10.2337/dci19-0028"
iupac = "IUPAC standard atomic weights: C 12.011, H 1.008, O 15.999"
definition = "Unit definitions (SI prefixes, clock)"
user = "The user, in conversation"
h04 = "Hovorka R et al. Nonlinear model predictive control of glucose concentration in subjects with type 1 diabetes. Physiol Meas 2004;25(4):905-920. doi:10.1088/0967-3334/25/4/010"
us504 = "US8977504B2, Hovorka R. Substance monitoring and control in human or animal bodies (US member of the CA2702345C family)"
wilinska2010 = "Wilinska ME et al. Simulation environment to evaluate closed-loop insulin delivery systems in type 1 diabetes. J Diabetes Sci Technol 2010;4(1):132-144. doi:10.1177/193229681000400117"
own = "Our own choice, no source"

# Units

[[claim]]
id = "glucose-molar-mass"
source = "iupac"
values = [180.156, 10.0, 1000.0]
status = "derived"
note = "C6H12O6 = 6*12.011 + 12*1.008 + 6*15.999. 10 dL per L, 1000 mmol per mol."

[[claim]]
id = "si-milli"
source = "definition"
values = [1000.0]
status = "source"

[[claim]]
id = "percent"
source = "definition"
values = [100]
status = "source"

[[claim]]
id = "clock"
source = "definition"
values = [24, 60]
status = "source"
note = "Hours per day, minutes per hour."

# Settings

[[claim]]
id = "man-30-min-blocks"
source = "camaps-manual"
at = "p59, p63, p64"
values = [30]
status = "source"

[[claim]]
id = "man-default-target"
source = "camaps-manual"
at = "p59, p70; 104.5 mg/dL in ware2022b p3"
values = [5.8]
status = "source"

[[claim]]
id = "man-personal-target-off"
source = "camaps-manual"
at = "p59, p60"
status = "source"
note = "Switched off: the default target applies. Times without a block show the default."

[[claim]]
id = "ware2022-target-range"
source = "ware2022"
at = "p4"
values = [4.4, 11.0]
status = "source"
note = "The manual gives no personal target range."

[[claim]]
id = "man-bolus-target-range"
source = "camaps-manual"
at = "p63"
values = [4.4, 11.0]
status = "source"
note = "mmol/L. The mg/dL edges the app shows are open."

[[claim]]
id = "man-min-glucose-range"
source = "camaps-manual"
at = "p62"
values = [2.8, 4.4]
status = "source"

[[claim]]
id = "man-insulin-action-range"
source = "camaps-manual"
at = "p64"
values = [2.0, 8.0]
status = "source"
note = "No step given."

[[claim]]
id = "man-max-bolus-range"
source = "camaps-manual"
at = "p63"
values = [0.5, 30.0, 0.5]
status = "source"

[[claim]]
id = "man-weight-range"
source = "camaps-manual"
at = "p29"
values = [10.0, 300.0, 1.0]
status = "source"

[[claim]]
id = "man-tdd-range"
source = "camaps-manual"
at = "p29"
values = [5.0, 350.0, 1.0]
status = "source"

[[claim]]
id = "man-calculator-not-auto"
source = "camaps-manual"
at = "p62, p63"
status = "source"

# Bolus calculator

[[claim]]
id = "man-carb-ratio"
source = "camaps-manual"
at = "p64"
status = "derived"
note = "CR is grams covered by one unit, so the meal part is carbs / CR."

[[claim]]
id = "man-correction-factor"
source = "camaps-manual"
at = "p63"
status = "derived"
note = "CF is the drop per unit and the correction aims at the bolus target, so (glucose - target) / CF."

[[claim]]
id = "man-negative-correction"
source = "camaps-manual"
at = "p63"
status = "source"

[[claim]]
id = "man-iob-correction-only"
source = "camaps-manual"
at = "p64"
status = "source"
note = "Floored at 0: IOB is never subtracted from the meal part."

[[claim]]
id = "man-max-bolus-cap"
source = "camaps-manual"
at = "p63"
status = "source"
note = "The floor at 0 (no negative bolus) is ours."

[[claim]]
id = "man-min-glucose-refuse"
source = "camaps-manual"
at = "p62"
status = "source"
note = "'a lower current glucose value': strictly below."

[[claim]]
id = "man-auto-meal-no-glucose"
source = "camaps-manual"
at = "p51"
status = "source"

[[claim]]
id = "man-ypsopump-bolus-step"
source = "camaps-manual"
at = "p50"
values = [10.0]
status = "source"
note = "0.1 U steps on YpsoPump, as steps per unit."

[[claim]]
id = "user-rounding-nearest"
source = "user"
at = "2026-10-10"
status = "user"
note = "The user's guess; neither manual says. Check: 3 g at CR 12 without glucose is 0.25 U, the app shows 0.2 or 0.3."

[[claim]]
id = "user-iob-below-target"
source = "user"
at = "2026-10-10"
status = "user"
note = "Below target, more IOB gives a smaller suggestion. Contradicts manual p64 'never subtracted from the meal bolus'. At exactly target the correction stays 0; whether the app subtracts IOB there is open."

# Metrics

[[claim]]
id = "battelino-tir-band"
source = "battelino2019"
at = "p3, Table 2"
values = [70.0, 180.0]
status = "source"

[[claim]]
id = "battelino-integer-bands"
source = "battelino2019"
at = "p3, Table 2"
status = "derived"
note = "Bands have whole mg/dL edges (54-69, 70-180, 181-250); simulated readings are rounded to whole mg/dL."

[[claim]]
id = "battelino-mean"
source = "battelino2019"
at = "p3, Table 2"
status = "source"

[[claim]]
id = "battelino-cv"
source = "battelino2019"
at = "p3, Table 2"
values = [2]
status = "derived"
note = "The metric is named, the formula isn't; sample SD over mean, which needs two readings."

# Recorded data

[[claim]]
id = "user-hypo-treatment"
source = "user"
at = "2026-10-10"
status = "user"
note = "Carbs logged with 0 U are hypo treatments."

# Controller (tir-tuner-aps). CamAPS FX itself isn't published: these are
# its published lineage and our stand-ins.

[[claim]]
id = "us504-egp"
source = "us504"
at = "p11, eq 12"
status = "source"
note = "EGP_B exp(-(r_E - BIC) ln2 / I_1/2). No values for EGP_B or I_1/2."

[[claim]]
id = "h04-period"
source = "h04"
at = "p7"
values = [15.0]
status = "source"
note = "CamAPS FX adjusts every 8-12 min (ware2022 p4); the manual allows 5-15 min cycles (p72)."

[[claim]]
id = "h04-horizon"
source = "h04"
at = "p9"
values = [240.0]
status = "source"
note = "Wilinska 2010 used 2.5 h. The FX horizon is unknown."

[[claim]]
id = "h04-max-rate"
source = "h04"
at = "p9, eq 9"
values = [4.0]
status = "source"
note = "4 U/h for 2004 pumps. CamAPS sets it per person (manual p70), rule unpublished."

[[claim]]
id = "h04-trajectory"
source = "h04"
at = "p8, Fig 4"
values = [2.0, 2.0, 1.0, 15.0]
status = "derived"
note = "H04 gives bands for target 6: 2 mmol/L/h above 8, 1 mmol/L/h for 6-8, 15 min halftime below 6. Here relative to the personal target."

[[claim]]
id = "own-kagr"
source = "own"
values = [5.0]
status = "assumption"
note = "H04 p9 gives the tuning rule (<5% of 36 runs below 3.3 mmol/L, fasting near 6), not the value."

[[claim]]
id = "own-rollout-step"
source = "own"
values = [1.0]
status = "assumption"
note = "The patent discretizes exactly (us504 eq 18-45). One minute matches the belief's own steps and keeps k31 dt < 1."

[[claim]]
id = "own-optimizer"
source = "own"
values = [6, 5, 50]
status = "assumption"
note = "Grid seed plus coordinate descent, at most 50 passes like H04 p9 capped Marquardt at 50 iterations. The patent uses a closed form (eq 99)."

[[claim]]
id = "own-hypo-cutoff"
source = "own"
status = "assumption"
note = "The lowest personal target, 4.4 (ware2022-target-range). No source has a suspend threshold. The manual (p70) only says insulin may be reduced further when glucose is low or falling fast."

[[claim]]
id = "own-reanchor"
source = "own"
values = [0.5]
status = "assumption"
note = "Stand-in for the patent's Kalman/IMM update (eq 72-77)."

[[claim]]
id = "ware2022-ease-off"
source = "ware2022"
at = "p4; 126 mg/dL in ware2022b p3"
values = [7.0]
status = "source"
note = "Suspends algorithm insulin below 7.0 and raises the target."

[[claim]]
id = "own-ease-off-target"
source = "own"
status = "assumption"
note = "The raised Ease-off target isn't published (ware2022 p4, manual p47 'slightly higher'). We use at least the 7.0 suspension level."

[[claim]]
id = "ware2022b-boost"
source = "ware2022b"
at = "p3"
values = [1.35]
status = "source"
note = "'approximately 35%', glucose-responsive, inactive once target is reached."

[[claim]]
id = "own-imm"
source = "own"
values = [3, 0.95, 0.05, 0.05, 0.03, 0.90, 0.05, 0.02, 0.05, 0.90]
status = "assumption"
note = "The patent (us504 p14, eq 65) defines N models and the transition matrix without values."
