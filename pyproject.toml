[project]
name = "tir-tuner"
version = "0.1.0"
description = "Type-1 diabetes Glooko export analysis: time-in-range and conservative carb-ratio / correction-factor tuning support"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "matplotlib>=3.7",
    "baml-py>=0.221",
    "typing-extensions>=4.0",   # required by the generated baml_client
    "pydantic>=2.0",            # generated baml_client uses python/pydantic output
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

# This is an application, not a distributable library: don't try to build/install
# the `analysis` package into the environment. It is run in place via `python -m analysis`.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Run the package in place (it is not installed; see [tool.uv] package = false).
pythonpath = ["."]
markers = [
    "llm: exercises the live LLM path (Anthropic API); run with RUN_LLM_EVALS=1",
]
